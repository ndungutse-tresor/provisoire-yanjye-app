# Render Blueprint: Render → New → Blueprint → pick this repository.
# The free plan needs no bank card. The database is Supabase (DATABASE_URL).
services:
  - type: web
    name: provisoire-yanjye
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Supabase → Connect → "Session pooler" string, with your database password in it.
      - key: DATABASE_URL
        sync: false
      # Signs login cookies. Render makes a random one; keep it the same or everyone is logged out.
      - key: SESSION_SECRET
        generateValue: true
